<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SJbs.AI - Reviews</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f8fafc; color: #0f172a; }
    .btn-blue { background-color: #3b82f6; color: #ffffff; font-weight: 500; transition: background 0.2s ease; }
    .btn-blue:hover { background-color: #2563eb; }
    
    #sidebar-overlay { transition: opacity 0.25s ease-in-out, visibility 0.25s ease-in-out; }
    #sidebar-overlay.overlay-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    #sidebar-overlay.overlay-visible { opacity: 1; visibility: visible; pointer-events: auto; }

    #app-sidebar { transition: transform 0.25s ease-in-out; }
    #app-sidebar.sidebar-closed { transform: translateX(-100%); }
    #app-sidebar.sidebar-open { transform: translateX(0); }

    /* Drawer Transition */
    #drawer-overlay { transition: opacity 0.25s ease-in-out, visibility 0.25s ease-in-out; }
    #drawer-overlay.drawer-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    #drawer-overlay.drawer-visible { opacity: 1; visibility: visible; pointer-events: auto; }

    #review-drawer { transition: transform 0.25s ease-in-out; }
    #review-drawer.drawer-closed { transform: translateX(100%); }
    #review-drawer.drawer-open { transform: translateX(0); }
  </style>
</head>
<body class="min-h-screen bg-slate-50 flex flex-col selection:bg-blue-500 selection:text-white">

  <!-- Component Containers -->
  <div id="header-container"></div>
  <div id="sidebar-container"></div>

  <!-- Main Content -->
  <main class="flex-1 max-w-3xl w-full mx-auto px-4 sm:px-6 py-8 space-y-6">
    <div class="space-y-1">
      <h1 class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight">Reviews</h1>
      <p id="reviews-subheader-count" class="text-xs sm:text-sm text-slate-500">0 need reply</p>
    </div>

    <!-- Screen-Wide Filter Pill Bar -->
    <div class="w-full bg-slate-100/90 p-1.5 rounded-2xl grid grid-cols-3 gap-1 shadow-xs text-center" id="filter-tabs">
      <button data-filter="needsYou" class="py-2.5 rounded-xl text-xs font-bold bg-white text-slate-900 shadow-xs border border-slate-200/80 transition">
        Needs you · <span id="count-needsyou">0</span>
      </button>
      <button data-filter="all" class="py-2.5 rounded-xl text-xs font-semibold text-slate-500 hover:text-slate-800 transition">
        All · <span id="count-all">0</span>
      </button>
      <button data-filter="replied" class="py-2.5 rounded-xl text-xs font-semibold text-slate-500 hover:text-slate-800 transition">
        Replied · <span id="count-replied">0</span>
      </button>
    </div>

    <!-- Feed Container -->
    <div id="reviews-feed-container" class="space-y-4"></div>
  </main>

  <!-- Right-to-Left Slide Drawer Overlay -->
  <div id="drawer-overlay" class="fixed inset-0 bg-slate-900/40 z-50 drawer-hidden"></div>

  <!-- Slide-Over Drawer Container -->
  <div id="review-drawer" class="fixed inset-y-0 right-0 z-50 w-full max-w-lg bg-white border-l border-slate-200 shadow-2xl drawer-closed flex flex-col justify-between overflow-y-auto">
    <div id="drawer-content" class="p-6 space-y-6"></div>
  </div>

  <!-- Unified JS Scripts -->
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/components.js"></script>
  <script src="js/page-reviews.js"></script>

</body>
</html>
