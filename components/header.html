<header class="w-full bg-white border-b border-slate-200 sticky top-0 z-30 h-16 flex items-center justify-between px-4 sm:px-6">
  <div class="flex items-center space-x-3">
    <button id="hamburger-btn" class="w-10 h-10 rounded-xl hover:bg-slate-100 flex items-center justify-center text-slate-700 focus:outline-none transition">
      <i class="fa-solid fa-bars text-lg"></i>
    </button>

    <a href="inbox.html" class="flex items-center space-x-1.5 text-xl sm:text-2xl font-black tracking-tight text-slate-900">
      <img src="favicon.png" alt="SJbs.AI" class="w-5 h-5 object-contain" />
      <span>SJbs.<span class="text-blue-600">AI</span></span>
    </a>
  </div>

  <div class="flex items-center space-x-3">
    <div id="header-plan-action"></div>

    <div class="relative">
      <button id="user-menu-btn" class="flex items-center space-x-1.5 p-1 rounded-full hover:bg-slate-100 transition focus:outline-none">
        <div id="user-avatar" class="w-9 h-9 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-xs shadow-xs">
          <i class="fa-solid fa-circle-notch fa-spin text-xs"></i>
        </div>
        <i class="fa-solid fa-chevron-down text-slate-400 text-[10px] pr-1"></i>
      </button>

      <div id="user-menu-popup" class="hidden absolute right-0 mt-2 w-48 bg-white border border-slate-200 rounded-2xl shadow-xl z-50 py-2 space-y-1">
        <a href="settings.html" class="flex items-center space-x-2.5 px-4 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-50 transition">
          <i class="fa-solid fa-gear text-slate-400"></i>
          <span>Settings</span>
        </a>
        <button id="logout-btn" class="w-full text-left flex items-center space-x-2.5 px-4 py-2 text-xs font-semibold text-rose-600 hover:bg-rose-50 transition">
          <i class="fa-solid fa-right-from-bracket"></i>
          <span>Log out</span>
        </button>
      </div>
    </div>
  </div>
</header>
