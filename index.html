<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReviewAI — Google Business Profile Manager</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google Material Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>

    <!-- Top App Navigation Bar -->
  <header class="app-bar">
    <div class="app-bar-brand">
      <span class="brand-logo">⚡</span>
      <span class="brand-name">Review<strong>AI</strong></span>
    </div>

    <!-- Official Google Auth Button (Shown when logged out) -->
    <button id="navLoginBtn" class="google-auth-btn" onclick="loginWithGoogle()">
      <svg class="google-icon" width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      <span>Sign in with Google</span>
    </button>

    <!-- User Profile Avatar (Shown when logged in) -->
    <div id="userMenu" class="user-menu" style="display: none;">
      <div class="user-avatar" id="userAvatar" onclick="toggleProfileDropdown()">S</div>
      <div id="profileDropdown" class="profile-dropdown">
        <div class="dropdown-header">
          <span class="user-email-text" id="dropdownEmail">user@email.com</span>
        </div>
        <button class="dropdown-item danger" onclick="logout()">
          <span class="material-symbols-outlined">logout</span> Sign Out
        </button>
      </div>
    </div>
  </header>

  <!-- Main App Shell -->
  <main class="app-container">

    <!-- DASHBOARD VIEW -->
    <div id="dashboardView" class="view-section">
      
      <!-- Business Selector Header -->
      <div class="location-header-card">
        <div class="location-picker">
          <span class="material-symbols-outlined store-icon">storefront</span>
          <select id="locationSelect" class="google-select" onchange="onLocationChange()">
            <option value="">Loading locations...</option>
          </select>
        </div>
        <button class="btn btn-autopilot" onclick="runAutopilot()">
          <span class="material-symbols-outlined">bolt</span> Sync AI Autopilot
        </button>
      </div>

      <!-- Overview Analytics Bar -->
      <div class="analytics-grid">
        <div class="stat-card">
          <span class="stat-value" id="statTotal">--</span>
          <span class="stat-label">Total Reviews</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="statRating">5.0 ★</span>
          <span class="stat-label">Average Score</span>
        </div>
        <div class="stat-card highlight">
          <span class="stat-value" id="statStatus">Active</span>
          <span class="stat-label">24/7 Background AI</span>
        </div>
      </div>

      <!-- Status Banner -->
      <div id="statusMsg" class="status-banner"></div>

      <!-- Feed Filter Tabs -->
      <div class="feed-tabs">
        <button class="tab-btn active" onclick="filterReviews('all')">All Reviews</button>
        <button class="tab-btn" onclick="filterReviews('replied')">Replied</button>
        <button class="tab-btn" onclick="filterReviews('pending')">Pending AI</button>
      </div>

      <!-- Google-Formatted Reviews List -->
      <div id="reviewList" class="reviews-feed"></div>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
