<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Reviews AI Dashboard</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; text-align: center; }
    .card { background: #1e293b; border-radius: 12px; padding: 20px; max-width: 480px; margin: 20px auto; border: 1px solid #334155; }
    button { background: #2563eb; color: #fff; border: none; padding: 14px 24px; font-size: 16px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 10px; }
    button:active { background: #1d4ed8; }
    select { width: 100%; padding: 12px; border-radius: 8px; background: #0f172a; color: #fff; border: 1px solid #475569; margin-top: 10px; font-size: 15px; }
    .review-card { background: #0f172a; padding: 15px; margin-top: 12px; border-radius: 8px; text-align: left; border: 1px solid #334155; }
    .reply-box { background: #1e1b4b; color: #a5b4fc; padding: 10px; border-radius: 6px; margin-top: 8px; font-size: 14px; }
  </style>
</head>
<body>

  <h2>Google Reviews AI Dashboard</h2>

  <!-- SIGN IN VIEW -->
  <div id="loginSection" class="card">
    <h3>Welcome Back</h3>
    <p>Sign in with your Google Account to manage business reviews automatically.</p>
    <button id="googleBtn" onclick="loginWithGoogle()">Sign in with Google</button>
  </div>

  <!-- MAIN DASHBOARD VIEW (Hidden initially) -->
  <div id="dashboardSection" class="card" style="display: none;">
    <p id="userEmail" style="color: #94a3b8;"></p>
    
    <label for="locationSelect" style="display: block; text-align: left; font-weight: 600;">Select Business Location:</label>
    <select id="locationSelect" onchange="onLocationChange()">
      <option value="">Loading your businesses...</option>
    </select>

    <button onclick="runAutopilot()" style="background: #10b981; margin-top: 15px;">🚀 Run AI Autopilot</button>
    
    <div id="statusMsg" style="margin-top: 15px; font-weight: 600;"></div>
    <div id="reviewList" style="margin-top: 20px;"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
