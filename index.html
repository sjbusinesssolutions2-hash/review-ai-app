<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review AI Dashboard</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      margin: 0;
      padding: 16px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }
    .card {
      background-color: #1e1e1e;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid #333;
    }
    .btn {
      background-color: #1a73e8;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
    }
    .btn:disabled {
      background-color: #444;
      cursor: not-allowed;
    }
    textarea {
      width: 100%;
      box-sizing: border-box;
      background-color: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 8px;
      margin-top: 8px;
      resize: vertical;
    }
    .star-rating {
      color: #fbc02d;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Google Reviews AI Dashboard</h1>

    <div class="card">
      <label for="accessToken"><strong>Google Access Token:</strong></label>
      <input type="text" id="accessToken" placeholder="Paste your Access Token here..." style="width:100%; box-sizing:border-box; padding:8px; margin-top:8px; background:#2a2a2a; color:#fff; border:1px solid #444; border-radius:4px;">
      <button class="btn" id="loadLocationBtn" onclick="initDashboard()">Connect & Load Reviews</button>
    </div>

    <div id="statusMessage" style="margin-bottom: 16px; color: #888;"></div>

    <div id="reviewsContainer"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
