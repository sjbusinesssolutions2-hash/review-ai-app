<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReviewAI — Google Business Profile Manager</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google Material Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>

  <!-- Top App Navigation Bar -->
  <header class="app-bar">
    <div class="app-bar-brand">
      <span class="brand-logo">⚡</span>
      <span class="brand-name">Review<strong>AI</strong></span>
    </div>

    <!-- Right Profile Menu (Clean Dropdown Style) -->
    <div id="userMenu" class="user-menu" style="display: none;">
      <div class="user-avatar" id="userAvatar" onclick="toggleProfileDropdown()">U</div>
      <div id="profileDropdown" class="profile-dropdown">
        <div class="dropdown-header">
          <span class="user-email-text" id="dropdownEmail">user@email.com</span>
        </div>
        <button class="dropdown-item danger" onclick="logout()">
          <span class="material-symbols-outlined">logout</span> Sign Out
        </button>
      </div>
    </div>

    <button id="navLoginBtn" class="btn btn-primary btn-sm" onclick="loginWithGoogle()">Sign in with Google</button>
  </header>

  <!-- Main App Shell -->
  <main class="app-container">

    <!-- DASHBOARD VIEW -->
    <div id="dashboardView" class="view-section">
      
      <!-- Business Selector Header -->
      <div class="location-header-card">
        <div class="location-picker">
          <span class="material-symbols-outlined store-icon">storefront</span>
          <select id="locationSelect" class="google-select" onchange="onLocationChange()">
            <option value="">Loading locations...</option>
          </select>
        </div>
        <button class="btn btn-autopilot" onclick="runAutopilot()">
          <span class="material-symbols-outlined">bolt</span> Sync AI Autopilot
        </button>
      </div>

      <!-- Overview Analytics Bar -->
      <div class="analytics-grid">
        <div class="stat-card">
          <span class="stat-value" id="statTotal">--</span>
          <span class="stat-label">Total Reviews</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="statRating">5.0 ★</span>
          <span class="stat-label">Average Score</span>
        </div>
        <div class="stat-card highlight">
          <span class="stat-value" id="statStatus">Active</span>
          <span class="stat-label">24/7 Background AI</span>
        </div>
      </div>

      <!-- Status Banner -->
      <div id="statusMsg" class="status-banner"></div>

      <!-- Feed Filter Tabs -->
      <div class="feed-tabs">
        <button class="tab-btn active" onclick="filterReviews('all')">All Reviews</button>
        <button class="tab-btn" onclick="filterReviews('replied')">Replied</button>
        <button class="tab-btn" onclick="filterReviews('pending')">Pending AI</button>
      </div>

      <!-- Google-Formatted Reviews List -->
      <div id="reviewList" class="reviews-feed"></div>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
