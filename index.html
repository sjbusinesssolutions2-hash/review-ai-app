<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReviewAI — Get more customers and revenue from Google</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>

  <!-- App Header -->
  <header class="app-bar">
    <div style="display: flex; align-items: center; gap: 12px;">
      <button class="btn btn-outline" style="padding: 6px; border: none; background: transparent;" onclick="toggleMobileSidebar()">
        <span class="material-symbols-outlined" style="font-size: 24px;">menu</span>
      </button>
      <a href="index.html" class="app-bar-brand">
        <span class="brand-logo">⭐</span>
        <span>Prosper<strong>AI</strong></span>
      </a>
    </div>

    <div style="display: flex; align-items: center; gap: 12px;">
      <button class="btn btn-primary btn-pill" onclick="window.location.href='login.html'">
        <span class="material-symbols-outlined" style="font-size: 16px;">shopping_bag</span> Shop Now
      </button>
    </div>
  </header>

  <!-- Mobile Sidebar Overlay & Drawer -->
  <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleMobileSidebar()"></div>
  <aside id="mobileSidebar" class="sidebar" style="position: fixed; top: 0; left: -270px; bottom: 0; z-index: 200; transition: left 0.3s ease;">
    <div style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--surface-border);">
      <span style="font-weight: 700; font-size: 16px;">Menu</span>
      <button class="btn btn-outline" style="padding: 4px; border: none; background: transparent;" onclick="toggleMobileSidebar()">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 12px;">
      <a href="login.html" class="sidebar-nav-item">Login</a>
      <a href="pricing.html" class="sidebar-nav-item">For Businesses</a>
      <a href="tools.html" class="sidebar-nav-item">Free Tools</a>
      <a href="pricing.html" class="sidebar-nav-item">Pricing</a>
    </div>
  </aside>

  <!-- Main Container -->
  <main class="app-container" style="max-width: 800px; text-align: center; padding: 60px 20px;">
    
    <!-- Hero Section -->
    <section style="margin-bottom: 50px;">
      <h1 style="font-size: 44px; font-weight: 800; line-height: 1.15; color: var(--text-primary); margin-bottom: 20px; letter-spacing: -0.5px;">
        Get more customers and <span style="color: var(--primary); position: relative;">revenue</span> from Google.
      </h1>
      <p style="font-size: 17px; color: var(--text-secondary); line-height: 1.6; max-width: 600px; margin: 0 auto 32px auto;">
        The easiest way to get 5-star reviews and boost your rating on Google.
      </p>
      <button class="btn btn-primary" style="padding: 14px 28px; font-size: 16px; border-radius: 12px;" onclick="window.location.href='login.html'">
        <span class="material-symbols-outlined" style="font-size: 20px;">shopping_bag</span> Shop Now
      </button>
    </section>

    <!-- Social Proof Trust Bar -->
    <section style="padding-top: 30px; border-top: 1px solid var(--surface-border);">
      <p style="font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 24px; text-transform: uppercase; letter-spacing: 0.5px;">
        Trusted by 15,000+ business locations worldwide
      </p>
      <div style="display: flex; justify-content: center; align-items: center; gap: 32px; flex-wrap: wrap; opacity: 0.7; font-weight: 700; font-size: 15px; color: var(--text-secondary);">
        <span>TACO BELL</span>
        <span>KFC</span>
        <span>STARBUCKS</span>
        <span>PIZZA HUT</span>
      </div>
    </section>

  </main>

  <!-- App Footer -->
  <footer class="app-footer" style="justify-content: center; gap: 24px; margin-top: auto;">
    <a href="index.html" style="color: var(--text-secondary); text-decoration: none;">Home</a>
    <a href="tools.html" style="color: var(--text-secondary); text-decoration: none;">Free Tools</a>
    <a href="pricing.html" style="color: var(--text-secondary); text-decoration: none;">Pricing</a>
  </footer>

  <script>
    function toggleMobileSidebar() {
      const sidebar = document.getElementById('mobileSidebar');
      const overlay = document.getElementById('sidebarOverlay');
      if (sidebar.style.left === '0px') {
        sidebar.style.left = '-270px';
        overlay.style.display = 'none';
      } else {
        sidebar.style.left = '0px';
        overlay.style.display = 'block';
      }
    }
  </script>
</body>
</html>
