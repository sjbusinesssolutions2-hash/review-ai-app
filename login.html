<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — ProsperAI</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background: var(--bg);">

  <main style="width: 100%; max-width: 420px; padding: 20px;">
    <!-- Auth Card Container -->
    <div style="background: var(--surface); border: 1px solid var(--surface-border); border-radius: 16px; padding: 36px 28px; box-shadow: var(--shadow-md); text-align: center;">
      
      <!-- Brand Header -->
      <a href="index.html" class="app-bar-brand" style="justify-content: center; margin-bottom: 24px;">
        <span class="brand-logo">⭐</span>
        <span>Prosper<strong>AI</strong></span>
      </a>

      <h2 style="font-size: 22px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px;">
        Sign in to your account
      </h2>
      <p style="font-size: 14px; color: var(--text-secondary); margin-bottom: 28px;">
        Connect your Google Business Profile to manage reviews and automate replies.
      </p>

      <!-- Auth Action Button -->
      <button id="googleAuthBtn" class="btn btn-outline" style="width: 100%; padding: 12px; font-size: 15px; border-radius: 10px; display: flex; align-items: center; justify-content: center; gap: 10px;" onclick="handleGoogleLogin()">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Sign in with Google
      </button>

      <!-- Status Indicator -->
      <div id="authStatus" style="margin-top: 16px; font-size: 13px; color: var(--text-secondary); display: none;">
        Authenticating...
      </div>

    </div>

    <!-- Return link -->
    <div style="text-align: center; margin-top: 20px;">
      <a href="index.html" style="font-size: 13px; color: var(--text-secondary); text-decoration: none;">← Back to Home</a>
    </div>
  </main>

  <script>
    const BACKEND_URL = 'https://review-ai-backend-03sb.onrender.com'; // Update with your Render URL

    // 1. Check if user already logged in or returning from OAuth redirect
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');
      const userId = urlParams.get('userId');

      if (token) {
        // Save persistent auth tokens
        localStorage.setItem('authToken', token);
        if (userId) localStorage.setItem('userId', userId);
        
        // Clean URL query params and redirect to actionable task inbox
        window.location.href = 'inbox.html';
        return;
      }

      // If token already exists in localStorage, redirect straight to app
      if (localStorage.getItem('authToken')) {
        window.location.href = 'inbox.html';
      }
    });

    // 2. Initiate Google OAuth Redirect
    function handleGoogleLogin() {
      const status = document.getElementById('authStatus');
      status.style.display = 'block';
      status.innerText = 'Redirecting to Google...';
      
      // Redirect directly to backend OAuth endpoint
      window.location.href = `${BACKEND_URL}/auth/google`;
    }
  </script>
</body>
</html>
