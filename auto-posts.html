<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SJbs.AI - Auto-Posts</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f8fafc; color: #0f172a; }
    .btn-blue { background-color: #3b82f6; color: #ffffff; font-weight: 500; transition: background 0.2s ease; }
    .btn-blue:hover { background-color: #2563eb; }
    
    #sidebar-overlay { transition: opacity 0.25s ease-in-out, visibility 0.25s ease-in-out; }
    #sidebar-overlay.overlay-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    #sidebar-overlay.overlay-visible { opacity: 1; visibility: visible; pointer-events: auto; }

    #app-sidebar { transition: transform 0.25s ease-in-out; }
    #app-sidebar.sidebar-closed { transform: translateX(-100%); }
    #app-sidebar.sidebar-open { transform: translateX(0); }
  </style>
</head>
<body class="min-h-screen bg-slate-50 flex flex-col selection:bg-blue-500 selection:text-white">

  <!-- Component Placeholders -->
  <div id="header-container"></div>
  <div id="sidebar-container"></div>

  <!-- Main Content -->
  <main class="flex-1 max-w-2xl w-full mx-auto px-4 sm:px-6 py-8 space-y-6">
    <div class="space-y-1">
      <h1 class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight">Auto-Posts</h1>
      <p class="text-xs sm:text-sm text-slate-500">Configure automated posting frequency and AI topics for your business</p>
    </div>

    <div id="auto-posts-container" class="space-y-5">
      <!-- Dynamic settings content loaded via page-auto-posts.js -->
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/components.js"></script>
  <script src="js/page-auto-posts.js"></script>
</body>
</html>
